name: PriceWatch Siman Sweep

on:
  schedule:
    # Diario 7am GMT-6 = 13:00 UTC (una hora despues del sweep de PriceSmart)
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: read   # el sitio viaja como artefacto: nada de commits al repo
  pages: write
  id-token: write

concurrency:
  group: pricewatch-siman
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore data cache (db + snapshots + logs viven fuera de git)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices.db
            data/siman.db
            data/snapshots/
            data/siman_snapshots/
            data/events.jsonl
            data/siman_events.jsonl
          key: pwdata-${{ github.run_id }}
          restore-keys: pwdata-

      - name: Bootstrap de eventos si el cache llegó vacío
        # rescata los jsonl del último commit que los trajo (cache perdido
        # o primera corrida tras sacarlos de git)
        run: |
          for f in data/events.jsonl data/siman_events.jsonl; do
            if [ ! -s "$f" ]; then
              SRC=$(git log --diff-filter=d --format=%H -1 -- "$f" || true)
              if [ -n "$SRC" ]; then
                git restore --source="$SRC" -- "$f" 2>/dev/null || true
              fi
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Siman watchlist sweep + rebuild dashboard
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          python -m pip install -r requirements.txt -q
          python scripts/sweep_siman.py
          python scripts/build_site.py

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices.db
            data/siman.db
            data/snapshots/
            data/siman_snapshots/
            data/events.jsonl
            data/siman_events.jsonl
          key: pwdata-${{ github.run_id }}

      - name: Empaquetar sitio (artefacto)
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Publicar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
