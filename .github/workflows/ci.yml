name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dev deps
        run: python -m pip install -r requirements-dev.txt -q

      - name: Ruff
        run: ruff check scripts tests

      - name: Pytest
        run: python -m pytest tests -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend tests (node:test)
        run: node --test tests/frontend/*.test.js
