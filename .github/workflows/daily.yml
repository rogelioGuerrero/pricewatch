name: PriceWatch Daily

on:
  schedule:
    # Diario 6am GMT-6 = 12:00 UTC: los 3 sweeps corren secuenciales en
    # un solo run — un solo cache save (sin carreras entre workflows),
    # el digest ve siempre el estado completo y hay un solo deploy/dia.
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read   # el sitio viaja como artefacto: nada de commits al repo
  pages: write
  id-token: write

concurrency:
  group: pricewatch-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # shallow pero con fondo: el bootstrap necesita git log para
          # rescatar data/*.jsonl del ultimo commit que los tuvo
          fetch-depth: 25

      - name: Restore data cache (db + snapshots + logs viven fuera de git)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices.db
            data/siman.db
            data/snapshots/
            data/siman_snapshots/
            data/events.jsonl
            data/siman_events.jsonl
          key: pwdata-${{ github.run_id }}
          restore-keys: pwdata-

      - name: Bootstrap de eventos si el cache llegó vacío
        # rescata los jsonl del último commit que los trajo (cache perdido
        # o primera corrida tras sacarlos de git)
        run: |
          for f in data/events.jsonl data/siman_events.jsonl; do
            if [ ! -s "$f" ]; then
              SRC=$(git log --diff-filter=d --format=%H -1 -- "$f" || true)
              if [ -n "$SRC" ]; then
                git restore --source="$SRC" -- "$f" 2>/dev/null || true
              fi
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -q

      - name: PriceSmart sweep + diff + historia
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: python scripts/sweep.py

      - name: Siman watchlist sweep
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: python scripts/sweep_siman.py

      - name: Stock check por club (candidatos)
        # chequeo ligero sobre ofertas + eventos recientes: detecta
        # velocidad de venta (se_agota) sin barrer el catalogo de nuevo
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: python scripts/sweep.py --stock-check

      - name: Rebuild dashboard
        run: python scripts/build_site.py

      - name: Digest email + push alerts (solo si hay novedades)
        # consolida los 3 sweeps del run; notify.py decide los umbrales.
        # Va antes del deploy: un fallo de Pages nunca bloquea el digest.
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: PriceWatch <info@agtisa.com>
          RESEND_TO: ${{ vars.RESEND_TO }}
          VAPID_PUBLIC: BCe97olK0g7PDhtvuC4BknYtgjzkzSlXv8MJ_Ve-9tMwnagCAU-lQmI1JtSgrSNrQZQE2pBr0O4H-vruxep4H6c
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SITE_URL: https://rogelioguerrero.github.io/pricewatch/
        run: python scripts/notify.py

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices.db
            data/siman.db
            data/snapshots/
            data/siman_snapshots/
            data/events.jsonl
            data/siman_events.jsonl
          key: pwdata-${{ github.run_id }}

      - name: Empaquetar sitio (artefacto)
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Publicar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
