name: PriceWatch Daily

on:
  schedule:
    # Diario 6am GMT-6 = 12:00 UTC: los 3 sweeps corren secuenciales en
    # un solo run — un solo cache save (sin carreras entre workflows),
    # el digest ve siempre el estado completo y hay un solo deploy/dia.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "full: recolectar; publish: publicar datos recuperados sin avisos"
        type: choice
        options: [full, publish]
        default: publish
      send_notifications:
        description: "Enviar avisos reales (solo modo full)"
        type: boolean
        default: false

permissions:
  contents: read   # el sitio viaja como artefacto: nada de commits al repo
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pricewatch-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # shallow: el bootstrap rescata los jsonl de un commit
          # pinneado (fetch por hash abajo), no del historial local
          fetch-depth: 25

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -q

      # Las rutas forman parte de la version del cache. Conservar las seis
      # originales para recuperar el historial; los recibos van aparte.
      - name: Restore data cache (db + snapshots + logs viven fuera de git)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices.db
            data/siman.db
            data/snapshots/
            data/siman_snapshots/
            data/events.jsonl
            data/siman_events.jsonl
          key: pwdata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pwdata-

      - name: Recuperar respaldo independiente si falta el cache
        if: steps.restore.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/data_health.py restore-github

      - name: Restaurar recibos de notificaciones
        # Un respaldo puede incluir recibos: no sobrescribirlos ni poblar
        # el runtime antes de la restauracion que exige un destino vacio.
        if: hashFiles('data/notifications.json') == ''
        uses: actions/cache/restore@v4
        with:
          path: data/notifications.json
          key: pwnotify-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pwnotify-

      - name: Bootstrap de eventos si el cache llegó vacío
        # rescata los jsonl del último commit que los tuvo — pinneado
        # porque con fetch-depth finito el git log sale de la ventana.
        # (cache perdido o primera corrida tras sacarlos de git)
        run: |
          git fetch --depth=1 origin \
            503b7bb18a5e57becf53a0e941e6f010e9ff72b2 2>/dev/null || true
          for f in data/events.jsonl data/siman_events.jsonl; do
            if [ ! -s "$f" ]; then
              git restore --source=503b7bb18a5e57becf53a0e941e6f010e9ff72b2 \
                -- "$f" 2>/dev/null || true
            fi
          done

      - name: PriceSmart sweep + diff + historia
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: python scripts/sweep.py

      - name: Siman watchlist sweep
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: python scripts/sweep_siman.py

      # el fetch de stock por club va dentro del sweep (un solo pase
      # sobre stock_candidates) — un --stock-check aparte repetia la
      # descarga contra la misma fecha base. El flag sigue existiendo
      # en sweep.py para corridas manuales a media tarde.
      - name: Validar integridad y frescura antes de promover datos
        id: health
        run: >-
          python scripts/data_health.py check --output data/quality.json
          ${{ (github.event_name == 'schedule' || inputs.mode == 'full') && '--fresh' || '' }}

      - name: Rebuild dashboard
        run: python scripts/build_site.py

      - name: Empaquetar sitio (artefacto)
        # v5 usa upload-artifact@v7, no visible para deploy-pages@v4 en este run.
        # Mantener el uploader compatible con el consumidor de Pages.
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar que la version nueva esta publicada
        run: >-
          python scripts/data_health.py verify-site
          --url https://rogelioguerrero.github.io/pricewatch/

      - name: Digest email + push alerts (solo si hay novedades)
        # consolida los 3 sweeps del run; notify.py decide los umbrales.
        # Va DESPUES del deploy: cuando el push llega al telefono el
        # Solo notificar despues de verificar la publicacion; una
        # re-publicacion manual nunca consulta tiendas ni envia avisos.
        if: >-
          success() && (github.event_name == 'schedule' ||
          (inputs.mode == 'full' && inputs.send_notifications))
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: PriceWatch <info@agtisa.com>
          RESEND_TO: ${{ vars.RESEND_TO }}
          VAPID_PUBLIC: BCe97olK0g7PDhtvuC4BknYtgjzkzSlXv8MJ_Ve-9tMwnagCAU-lQmI1JtSgrSNrQZQE2pBr0O4H-vruxep4H6c
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SITE_URL: https://rogelioguerrero.github.io/pricewatch/
        run: python scripts/notify.py

      - name: Crear respaldo validado de datos
        id: backup
        if: always() && steps.health.outcome == 'success'
        run: >-
          python scripts/data_health.py backup
          --output backup/pricewatch-backup.tar.gz

      - name: Guardar respaldo independiente del cache (90 dias)
        if: always() && steps.backup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pricewatch-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup/pricewatch-backup.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Guardar recibos de notificaciones
        if: >-
          always() && steps.health.outcome == 'success' &&
          hashFiles('data/notifications.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/notifications.json
          key: pwnotify-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save data cache
        if: always() && steps.health.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices.db
            data/siman.db
            data/snapshots/
            data/siman_snapshots/
            data/events.jsonl
            data/siman_events.jsonl
          key: pwdata-${{ github.run_id }}-${{ github.run_attempt }}
