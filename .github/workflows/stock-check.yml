name: PriceWatch Stock Check

on:
  schedule:
    # Diario 8am GMT-6 = 14:00 UTC: chequeo ligero de stock por club
    # en candidatos (ofertas + eventos recientes). Detecta velocidad
    # de venta (se_agota) sin barrer el catalogo.
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pricewatch-stock-check
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Stock check + rebuild dashboard
        run: |
          python scripts/sweep.py --stock-check
          python scripts/build_site.py

      - name: Commit data + dashboard
        run: |
          git config user.name "pricewatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/index.html
          git diff --staged --quiet || git commit -m "stock-check: $(date +%F)"
          git push
