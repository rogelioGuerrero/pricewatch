name: PriceWatch Stock Check

on:
  schedule:
    # Diario 8am GMT-6 = 14:00 UTC: chequeo ligero de stock por club
    # en candidatos (ofertas + eventos recientes). Detecta velocidad
    # de venta (se_agota) sin barrer el catalogo.
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pricewatch-stock-check
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore data cache (db + snapshots viven fuera de git)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices.db
            data/siman.db
            data/snapshots/
            data/siman_snapshots/
          key: pwdata-${{ github.run_id }}
          restore-keys: pwdata-

      - name: Bootstrap data desde el commit anterior (solo si no hay cache)
        run: |
          if [ ! -f data/prices.db ]; then
            SRC=$(git log --diff-filter=d --format=%H -1 -- data/prices.db || true)
            if [ -n "$SRC" ]; then
              git restore --source="$SRC" -- data/ 2>/dev/null || true
            fi
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Stock check + rebuild dashboard
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          python scripts/sweep.py --stock-check
          python scripts/build_site.py

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices.db
            data/siman.db
            data/snapshots/
            data/siman_snapshots/
          key: pwdata-${{ github.run_id }}

      - name: Commit data + dashboard
        run: |
          git config user.name "pricewatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ data/events.jsonl data/siman_events.jsonl \
                  data/mis-compras.json data/watchlist_siman.json
          git diff --staged --quiet || git commit -m "stock-check: $(date +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --no-edit -X ours || git merge --abort
            sleep 10
          done
          git push

      - name: Digest email + push alerts (solo si hay novedades)
        # Ultimo job del dia (8am SV): consolida sweep + siman + stock-check.
        # notify.py decide los umbrales; sin novedades no envia nada.
        env:
          APPWRITE_ENDPOINT: https://sfo.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6ab1922d00020f5a2e99
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: PriceWatch <info@agtisa.com>
          RESEND_TO: guerrero_vi@yahoo.com
          VAPID_PUBLIC: BCe97olK0g7PDhtvuC4BknYtgjzkzSlXv8MJ_Ve-9tMwnagCAU-lQmI1JtSgrSNrQZQE2pBr0O4H-vruxep4H6c
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SITE_URL: https://rogelioguerrero.github.io/pricewatch/
        run: |
          python -m pip install -r requirements.txt -q
          python scripts/notify.py
