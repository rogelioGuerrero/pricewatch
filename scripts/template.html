<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PriceWatch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PriceWatch SV — Qué cambió en PriceSmart</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="stylesheet" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/@finos/perspective-viewer@3.8.0/dist/css/themes.css">
<style>
  :root { --bg:#0f1420; --card:#1a2133; --line:#2a3350; --txt:#e8ecf5;
          --mut:#8b93ad; --down:#34d399; --up:#f87171; --info:#60a5fa; --warn:#fbbf24; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--txt); font:14px/1.45 system-ui,sans-serif; }
  .wrap { max-width:1150px; margin:0 auto; padding:16px; }
  header h1 { font-size:20px } header p { color:var(--mut); font-size:12px }
  .demo { background:#7c2d12; color:#fed7aa; padding:6px 10px; border-radius:6px;
          font-size:12px; margin:10px 0; display:inline-block }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
          gap:10px; margin:14px 0 }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px }
  .kpi b { font-size:22px; display:block }
  .kpi span { color:var(--mut); font-size:11px }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:16px 0 12px;
          overflow-x:auto }
  .tab { padding:8px 14px; cursor:pointer; color:var(--mut); font-size:13px;
         border-bottom:2px solid transparent; white-space:nowrap }
  .tab.on { color:var(--txt); border-color:var(--info); font-weight:600 }
  .tab .n { font-size:11px; background:var(--line); border-radius:99px; padding:1px 7px; margin-left:4px }
  .filters { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap }
  input { background:var(--card); border:1px solid var(--line); color:var(--txt);
          border-radius:8px; padding:8px 10px; font-size:13px; width:280px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:10px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:10px 12px; cursor:pointer; display:flex; gap:10px;
          transition:border-color .15s }
  .card:hover { border-color:var(--info) }
  .card img { width:64px; height:64px; object-fit:contain; border-radius:8px;
              background:#fff; flex-shrink:0 }
  .card .t { font-size:13px; margin-bottom:4px; line-height:1.3 }
  .card .meta { color:var(--mut); font-size:11px; margin-top:2px }
  .tag { font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; }
  .tag.bajo { background:#064e3b; color:var(--down) }
  .tag.subio { background:#4c0519; color:var(--up) }
  .tag.oferta { background:#1e3a8a; color:#93c5fd }
  .tag.agotado { background:#3f3f46; color:#d4d4d8 }
  .tag.reaparecio { background:#422006; color:var(--warn) }
  .tag.regreso { background:#3b0764; color:#c4b5fd }
  .tag.nuevo { background:#14532d; color:#86efac }
  .tag.salio_del_catalogo { background:#374151; color:#9ca3af }
  .tag.oferta_termino { background:#374151; color:#9ca3af }
  .tag.club_volvio { background:#422006; color:var(--warn) }
  .tag.club_agotado { background:#3f3f46; color:#d4d4d8 }
  .pr { font-weight:700 } .old { color:var(--mut); text-decoration:line-through; font-weight:400 }
  .spark { height:30px; margin-top:4px; min-width:120px }
  perspective-viewer { display:block; width:100%; height:70vh }
  .pane { display:none } .pane.on { display:block }
  dialog { background:var(--card); color:var(--txt); border:1px solid var(--line);
           border-radius:12px; padding:20px; width:min(720px,94vw) }
  dialog::backdrop { background:#000a }
  #chart { width:100%; height:300px; margin-top:10px }
  .close { float:right; cursor:pointer; color:var(--mut); font-size:18px }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px }
  td,th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left }
  th { color:var(--mut); font-weight:500 }
  .bigprice { font-size:30px; font-weight:700; margin:10px 0 }
  .star { position:absolute; top:8px; right:10px; font-size:18px; cursor:pointer;
          color:var(--mut) } .star.on { color:var(--warn) }
  .card { position:relative }
  .plink { display:inline-block; margin-top:10px; color:var(--info);
           font-size:13px }
  .tag.real { background:#064e3b; color:#86efac }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PriceWatch SV</h1>
    <p>Línea base + variaciones detectadas en pricesmart.com/es-sv · datos al <b id="gen"></b></p>
    <span class="demo" id="demo-banner" style="display:none">DEMO — el historial es sintético hasta acumular corridas reales (mar/jue)</span>
  </header>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <div class="filters"><input id="q" placeholder="Buscar en todo el catálogo (nombre, marca, SKU)…"></div>
  <div class="pane" id="pane-buscar"><div class="grid" id="g-buscar"></div></div>
  <div class="pane on" id="pane-cambios"><div class="grid" id="g-cambios"></div></div>
  <div class="pane" id="pane-ofertas"><div class="grid" id="g-ofertas"></div></div>
  <div class="pane" id="pane-stock"><div class="grid" id="g-stock"></div></div>
  <div class="pane" id="pane-nuevos"><div class="grid" id="g-nuevos"></div></div>
  <div class="pane" id="pane-mejores"><div class="grid" id="g-mejores"></div></div>
  <div class="pane" id="pane-favs"><div class="grid" id="g-favs"></div></div>
  <div class="pane" id="pane-explorar">
    <div class="filters">Agrupar:
      <select id="grp1" style="background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px">
        <option value="">sin agrupar</option>
        <option value="categoria">por categoría</option>
        <option value="marca">por marca</option>
      </select>
      <label style="font-size:13px;color:var(--mut);display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="stok1" style="width:auto"> solo con stock
      </label>
    </div>
    <perspective-viewer id="pv"></perspective-viewer>
  </div>
  <div class="pane" id="pane-inteligencia">
    <div class="filters">Agrupar:
      <select id="grp" style="background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px">
        <option value="categoria">por categoría</option>
        <option value="marca">por marca</option>
        <option value="">sin agrupar</option>
      </select>
      <label style="font-size:13px;color:var(--mut);display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="stok2" style="width:auto"> solo con stock
      </label>
    </div>
    <perspective-viewer id="pv2"></perspective-viewer>
  </div>
</div>
<dialog id="dlg">
  <span class="close" onclick="dlg.close()">✕</span>
  <div style="display:flex;gap:12px;align-items:start">
    <img id="dimg" style="width:80px;height:80px;object-fit:contain;background:#fff;border-radius:8px">
    <div style="flex:1"><h2 id="dtitle"></h2><div class="meta" id="dmeta"></div><div class="bigprice" id="dprice"></div></div>
    <span id="dstar" class="star" style="position:static;font-size:26px"></span>
  </div>
  <div id="chart"></div>
  <div id="dclubs"></div>
  <a id="dlink" class="plink" target="_blank" rel="noopener">Ver en pricesmart.com ↗</a>
  <a id="dshare" class="plink" style="margin-left:14px;cursor:pointer">Copiar enlace</a>
  <table id="dtable"></table>
</dialog>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const fmt = c => c == null ? "—" : "$" + (c/100).toFixed(2);
document.getElementById("gen").textContent = D.generated;
if (D.demo) document.getElementById("demo-banner").style.display = "";
const img = sku => (D.products[sku]||{}).image || "";
const ev = D.events.slice().reverse();
const byType = t => ev.filter(e=>e.type===t);

const FAV = new Set(JSON.parse(localStorage.getItem("pw-favs")||"[]"));
const toggleFav = (sku,e)=>{e.stopPropagation();
  FAV.has(sku)?FAV.delete(sku):FAV.add(sku);
  localStorage.setItem("pw-favs",JSON.stringify([...FAV]));render();
  const n=document.querySelector('.tab[data-t="favs"] .n');
  if(n) n.textContent=FAV.size;};
const star = sku =>
  `<span class="star ${FAV.has(sku)?"on":""}" onclick="toggleFav('${sku}',event)">${FAV.has(sku)?"★":"☆"}</span>`;

const TABS = [
  ["cambios","Cambios de precio", byType("bajo").length + byType("subio").length],
  ["ofertas","Ofertas", D.ofertas.length],
  ["stock","Se acabó / Volvió",
   byType("agotado").length + byType("reaparecio").length
   + byType("salio_del_catalogo").length + byType("regreso").length
   + byType("club_agotado").length + byType("club_volvio").length],
  ["nuevos","Nuevos", byType("nuevo").length],
  ["mejores","Mejores precios",
   Object.keys(D.agg).filter(s=>(D.series[s]||[]).length>=3
     && D.agg[s].pct_min<=0 && D.agg[s].d_out===0).length],
  ["favs","Mi lista", FAV.size],
  ["explorar","Explorar catálogo", D.n_products],
  ["inteligencia","Inteligencia", D.n_products],
];
$("#tabs").innerHTML = TABS.map(([id,n,nr]) =>
  `<div class="tab" data-t="${id}">${n}<span class="n">${nr}</span></div>`).join("");
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".pane").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  document.getElementById("pane-"+t.dataset.t).classList.add("on");
  if (t.dataset.t==="explorar") loadExplorer();
  if (t.dataset.t==="inteligencia") loadIntel();
});
document.querySelector(".tab").classList.add("on");

const idxTxt = D.indice==null ? "—"
  : (D.indice>0?"+":"")+D.indice+"%";
$("#kpis").innerHTML = [
  [D.n_products,"productos en línea base"],
  [D.ofertas.length,"ofertas activas"],
  [D.n_stockout,"sin stock hoy"],
  [byType("bajo").length,"bajadas"],
  [byType("subio").length,"subidas"],
  [idxTxt,"índice del catálogo"],
].map(([b,s])=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join("");

// frescura: proxima corrida (mar/jue 12:00 UTC)
(function(){
  const dias = {2:"martes",4:"jueves"};
  const d = new Date();
  for (let i=1;i<8;i++){
    const n = new Date(d); n.setDate(d.getDate()+i);
    if (dias[n.getUTCDay()]) {
      document.querySelector("header p").insertAdjacentHTML("beforeend",
        ` · próximo barrido: <b>${dias[n.getUTCDay()]}</b>`);
      break;
    }
  }
})();

const LABEL = {agotado:"se acabó", reaparecio:"volvió",
  salio_del_catalogo:"salió del catálogo", regreso:"regresó al catálogo",
  nuevo:"nuevo", oferta_termino:"terminó oferta",
  club_volvio:"volvió a", club_agotado:"se acabó en"};
function card(e){
  const p = D.products[e.sku]||{};
  let price;
  if (e.from != null && e.to != null)
    price = `<span class="old">${fmt(e.from)}</span> → <span class="pr">${fmt(e.to)}</span>
      <span class="tag ${e.type}">${e.pct>0?"+":""}${e.pct}%</span>
      ${["reaparecio","regreso"].includes(e.type)?`<span class="tag ${e.type}">${LABEL[e.type]}</span>`:""}`;
  else if (e.type==="oferta"){
    const a = D.agg[e.sku]||{}, hist = (D.series[e.sku]||[]).length>=3;
    price = `<span class="pr">${fmt(e.price)}</span> <span class="tag oferta">ahorra $${(+e.saving).toFixed(2)}</span>`
      + (hist && a.pct_min<=0 ? `<span class="tag real">oferta real</span>` : "");
  }
  else
    price = `<span class="pr">${fmt(e.price)}</span> <span class="tag ${e.type}">${(LABEL[e.type]||e.type)}${e.club?" "+e.club:""}</span>`;
  const dias = e.days_out != null ? ` · ${e.days_out}d fuera` : "";
  return `<div class="card" onclick="openProd('${e.sku}')">
    ${star(e.sku)}
    ${img(e.sku)?`<img src="${img(e.sku)}" loading="lazy" onerror="this.remove()">`:""}
    <div style="flex:1;min-width:0">
      <div class="t">${e.title||p.title||e.sku}</div><div>${price}</div>
      <div class="meta">${e.date||""}${dias} · ${p.category||""}</div>
      <div class="spark" data-sku="${e.sku}"></div></div></div>`;
}
function render(){
  const q = $("#q").value.toLowerCase();
  const f = e => !q || (e.title||"").toLowerCase().includes(q)
                   || (D.products[e.sku]||{}).title?.toLowerCase().includes(q);
  $("#g-cambios").innerHTML = ev.filter(e=>["bajo","subio"].includes(e.type)&&f(e)).map(e=>card(e)).join("") || "<p class='meta'>Sin cambios</p>";
  $("#g-ofertas").innerHTML = ev.filter(e=>["oferta","oferta_termino"].includes(e.type)&&f(e)).map(e=>card(e)).join("")
    || D.ofertas.filter(o=>!q||o.title?.toLowerCase().includes(q)).map(o=>card({sku:o.sku,type:"oferta",saving:o.saving,price:o.price,title:o.title})).join("");
  $("#g-stock").innerHTML = ev.filter(e=>["agotado","reaparecio","salio_del_catalogo","regreso","club_agotado","club_volvio"].includes(e.type)&&f(e)).map(e=>card(e)).join("") || "<p class='meta'>Sin cambios de disponibilidad</p>";
  $("#g-nuevos").innerHTML = ev.filter(e=>e.type==="nuevo"&&f(e)).map(e=>card(e)).join("") || "<p class='meta'>Sin productos nuevos</p>";
  $("#g-mejores").innerHTML = Object.entries(D.agg)
    .filter(([s,a]) => a.pct_min<=0 && a.d_out===0
            && (D.series[s]||[]).length>=3
            && (!q || (D.products[s]||{}).title?.toLowerCase().includes(q)))
    .sort((x,y)=>x[1].vs_med-y[1].vs_med).slice(0,90)
    .map(([s,a])=>{
      const p=D.products[s]||{}, l=(D.series[s]||[]).slice(-1)[0];
      return `<div class="card" onclick="openProd('${s}')">
        ${img(s)?`<img src="${img(s)}" loading="lazy" onerror="this.remove()">`:""}
        <div style="flex:1;min-width:0">
          <div class="t">${p.title||s}</div>
          <div><span class="pr">${l?fmt(l[1]):"—"}</span>
            <span class="tag nuevo">mín histórico</span>
            ${a.vs_med<0?`<span class="tag bajo">${a.vs_med}% vs típico</span>`:""}</div>
          <div class="meta">${p.category||""} · ${a.n_ch} cambios · ${a.pct_stock}% días con stock</div>
          <div class="spark" data-sku="${s}"></div></div></div>`;
    }).join("") || "<p class='meta'>Nada en su mínimo hoy</p>";
  $("#g-favs").innerHTML = [...FAV].map(favCard).join("")
    || "<p class='meta'>Marca productos con ☆ para seguirlos aquí. La lista vive en tu teléfono, sin cuenta.</p>";
  if (q.length >= 2) {
    $("#g-buscar").innerHTML = Object.keys(D.products)
      .filter(s => { const p = D.products[s]||{};
        return (p.title||"").toLowerCase().includes(q) || s.includes(q)
          || (p.brand||"").toLowerCase().includes(q)
          || (p.category||"").toLowerCase().includes(q); })
      .slice(0, 60).map(favCard).join("")
      || "<p class='meta'>Sin coincidencias en el catálogo</p>";
  }
  sparks();
}
// clubes del usuario: match por nombre del canal
const CLUB_MATCH = [["Santa Elena","elena"],["Los Héroes","héroe|heroe"],
                    ["San Miguel","miguel"]];
function clubChips(sku){
  const cl = D.clubs[sku]||{};
  if (!Object.keys(cl).length)
    return `<span class="meta">sin dato de club aún</span>`;
  return CLUB_MATCH.map(([label,pat])=>{
    const k = Object.keys(cl).find(n=>new RegExp(pat,"i").test(n));
    const c = k ? cl[k] : null;
    return `<span class="tag ${c&&c.in_stock?"bajo":"agotado"}">${label} ${c?(c.in_stock?"✓":"✗"):"—"}</span>`;
  }).join(" ");
}
function favCard(sku){
  const p = D.products[sku]||{}, l = (D.series[sku]||[]).slice(-1)[0],
        a = D.agg[sku]||{};
  return `<div class="card" onclick="openProd('${sku}')">
    ${star(sku)}
    ${img(sku)?`<img src="${img(sku)}" loading="lazy" onerror="this.remove()">`:""}
    <div style="flex:1;min-width:0">
      <div class="t">${p.title||sku}</div>
      <div><span class="pr">${l?fmt(l[1]):"—"}</span>
        ${a.pct_min<=0?`<span class="tag real">mín histórico</span>`
          :a.pct_min!=null?`<span class="meta">+${a.pct_min}% sobre mín</span>`:""}
        ${l&&l[3]>0?`<span class="tag oferta">-$${(+l[3]).toFixed(2)}</span>`:""}</div>
      <div style="margin-top:5px">${clubChips(sku)}</div>
      <div class="spark" data-sku="${sku}"></div></div></div>`;
}
// el buscador global: >=2 letras muestra panel de resultados del catalogo
// completo sobre cualquier tab; tambien filtra las tablas Perspective
function pspFilter(id){
  const q = $("#q").value.trim();
  const f = [];
  if (q) f.push(/^\d+$/.test(q) ? ["sku","contains",q]
                               : ["producto","contains",q]);
  const cb = document.getElementById(id === "pv" ? "stok1" : "stok2");
  if (cb?.checked) f.push(["stock","==","sí"]);
  document.getElementById(id).restore({filter: f});
}
$("#q").oninput = () => {
  const q = $("#q").value.trim();
  const t = document.querySelector(".tab.on")?.dataset.t;
  const esTabla = t === "explorar" || t === "inteligencia";
  document.querySelectorAll(".pane").forEach(x=>x.classList.remove("on"));
  // en tabs de tarjetas: panel de resultados del catalogo;
  // en tabs de tabla: la tabla queda y se filtra sola
  if (q.length >= 2 && !esTabla)
    document.getElementById("pane-buscar").classList.add("on");
  else document.getElementById("pane-"+t)?.classList.add("on");
  render();
  if (t === "explorar" && pvDone) pspFilter("pv");
  if (t === "inteligencia" && pv2Done) pspFilter("pv2");
};

function sparks(){
  document.querySelectorAll(".spark").forEach(el => {
    const s = D.series[el.dataset.sku]||[];
    if (s.length < 2) return;
    const pts = s.map(p=>p[1]), mn=Math.min(...pts), mx=Math.max(...pts);
    const w=280,h=28, rng=(mx-mn)||1;
    const xy = pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-2-(v-mn)/rng*(h-4)).toFixed(1)}`).join(" ");
    const col = s[s.length-1][1] <= s[0][1] ? "var(--down)" : "var(--up)";
    el.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${xy}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`;
  });
}

let pvDone=false;
async function loadExplorer(attempt=0){
  if (pvDone) return;
  const pane = document.getElementById("pane-explorar");
  const msg = t => { pane.querySelector(".pv-status")?.remove();
    pane.insertAdjacentHTML("beforeend", `<p class="meta pv-status" style="padding:10px">${t}</p>`); };
  msg("Cargando explorador (WASM, solo la primera vez)…");
  try {
    const psp = (await import('https://cdn.jsdelivr.net/npm/@finos/perspective@3.8.0/dist/cdn/perspective.js')).default;
    await import('https://cdn.jsdelivr.net/npm/@finos/perspective-viewer@3.8.0/dist/cdn/perspective-viewer.js');
    await import('https://cdn.jsdelivr.net/npm/@finos/perspective-viewer-datagrid@3.8.0/dist/cdn/perspective-viewer-datagrid.js');
    await import('https://cdn.jsdelivr.net/npm/@finos/perspective-viewer-d3fc@3.8.0/dist/cdn/perspective-viewer-d3fc.js');
    const rows = Object.entries(D.products).map(([sku,p])=>{
      const last = (D.series[sku]||[]).slice(-1)[0];
      return {sku, producto:p.title, marca:p.brand||"", categoria:p.category||"",
        precio: last?+(last[1]/100).toFixed(2):null,
        ahorro: last?+((last[3]||0).toFixed(2)):0,
        stock: last?(last[2]?"sí":"no"):"?"};
    });
    const worker = await psp.worker();
    const table = await worker.table(rows);
    const pv = document.getElementById("pv");
    await pv.load(table);
    await pv.restore({plugin: "Datagrid", theme: "Pro Dark"});
    pvDone = true;
    pane.querySelector(".pv-status")?.remove();
    document.getElementById("grp1").onchange = e =>
      pv.restore({group_by: e.target.value ? [e.target.value] : []});
    document.getElementById("stok1").onchange = () => pspFilter("pv");
    if ($("#q").value.trim() || document.getElementById("stok1").checked)
      pspFilter("pv");
    pv.addEventListener("perspective-click", e => {
      const r = e.detail?.row;
      if (r && r.sku != null) openProd(String(r.sku));
    });
  } catch(e) {
    if (attempt < 2) { msg("Reintentando…"); await new Promise(r=>setTimeout(r,1500)); return loadExplorer(attempt+1); }
    msg("No se pudo cargar el explorador (CDN/WASM). Recarga la página e intenta de nuevo.");
  }
}

let pv2Done=false;
async function loadIntel(attempt=0){
  if (pv2Done) return;
  const pane = document.getElementById("pane-inteligencia");
  const msg = t => { pane.querySelector(".pv-status")?.remove();
    pane.insertAdjacentHTML("beforeend", `<p class="meta pv-status" style="padding:10px">${t}</p>`); };
  msg("Cargando inteligencia (WASM)…");
  try {
    const psp = (await import('https://cdn.jsdelivr.net/npm/@finos/perspective@3.8.0/dist/cdn/perspective.js')).default;
    await import('https://cdn.jsdelivr.net/npm/@finos/perspective-viewer@3.8.0/dist/cdn/perspective-viewer.js');
    await import('https://cdn.jsdelivr.net/npm/@finos/perspective-viewer-datagrid@3.8.0/dist/cdn/perspective-viewer-datagrid.js');
    await import('https://cdn.jsdelivr.net/npm/@finos/perspective-viewer-d3fc@3.8.0/dist/cdn/perspective-viewer-d3fc.js');
    const rows = Object.entries(D.products).map(([sku,p])=>{
      const l = (D.series[sku]||[]).slice(-1)[0];
      const a = D.agg[sku]||{};
      return {sku, producto:p.title, marca:p.brand||"", categoria:p.category||"",
        precio: l?+(l[1]/100).toFixed(2):null,
        min_hist: a.min!=null?+(a.min/100).toFixed(2):null,
        max_hist: a.max!=null?+(a.max/100).toFixed(2):null,
        pct_sobre_min: a.pct_min ?? null,
        vs_tipico_pct: a.vs_med ?? null,
        ahorro_letrero: l?+((l[3]||0).toFixed(2)):0,
        n_cambios: a.n_ch ?? null, ult_cambio: a.last_ch||"",
        pct_dias_stock: a.pct_stock ?? null, dias_agotado: a.d_out ?? 0,
        n_veces_agotado: a.n_out ?? 0,
        stock: l?(l[2]?"sí":"no"):"?"};
    });
    const worker = await psp.worker();
    const table = await worker.table(rows);
    const pv = document.getElementById("pv2");
    await pv.load(table);
    await pv.restore({plugin: "Datagrid", theme: "Pro Dark",
                      group_by: ["categoria"],
                      aggregates: {precio:"avg", pct_sobre_min:"avg",
                        vs_tipico_pct:"avg", ahorro_letrero:"sum",
                        n_cambios:"sum", dias_agotado:"avg"}});
    pv2Done = true;
    pane.querySelector(".pv-status")?.remove();
    document.getElementById("grp").onchange = e =>
      pv.restore({group_by: e.target.value ? [e.target.value] : []});
    document.getElementById("stok2").onchange = () => pspFilter("pv2");
    if ($("#q").value.trim() || document.getElementById("stok2").checked)
      pspFilter("pv2");
    pv.addEventListener("perspective-click", e => {
      const r = e.detail?.row;
      if (r && r.sku != null) openProd(String(r.sku));
    });
  } catch(e) {
    if (attempt < 2) { msg("Reintentando…"); await new Promise(r=>setTimeout(r,1500)); return loadIntel(attempt+1); }
    msg("No se pudo cargar el explorador (CDN/WASM). Recarga la página e intenta de nuevo.");
  }
}

const dlg = document.getElementById("dlg");
let chart;
function openProd(sku){
  const p = D.products[sku]||{}, s = D.series[sku]||[];
  const last = s.slice(-1)[0];
  $("#dimg").src = img(sku); $("#dimg").style.display = img(sku)?"":"none";
  $("#dtitle").textContent = p.title||sku;
  $("#dmeta").textContent = `${p.brand||""} · ${p.category||""} · SKU ${sku}`;
  $("#dprice").textContent = last ? fmt(last[1]) : "—";
  const dl = $("#dlink");
  if (p.slug){ dl.style.display=""; dl.href =
    `https://www.pricesmart.com/es-sv/producto/${p.slug}/${sku}`; }
  else dl.style.display = "none";
  const ds = $("#dstar");
  ds.textContent = FAV.has(sku) ? "★" : "☆";
  ds.className = "star" + (FAV.has(sku) ? " on" : "");
  ds.onclick = () => toggleFav(sku, {stopPropagation(){}}) || openProd(sku);
  $("#dshare").onclick = () => {
    const url = `${location.origin}${location.pathname}?sku=${sku}`;
    navigator.clipboard?.writeText(url);
    $("#dshare").textContent = "¡Copiado!";
    setTimeout(()=>$("#dshare").textContent="Copiar enlace", 1500);
  };
  const clubs = D.clubs[sku]||{};
  const clubRows = Object.entries(clubs);
  $("#dclubs").innerHTML = clubRows.length
    ? "<h2 style='margin-top:14px'>Disponibilidad en clubes</h2><table><tr><th>Club</th><th>Stock</th></tr>" +
      clubRows.map(([n,c])=>`<tr><td>${n}</td><td>${c.in_stock?`<b style="color:var(--down)">✓ ${c.qty} uds</b>`:'<span style="color:var(--mut)">agotado</span>'}</td></tr>`).join("") + "</table>"
    : "";
  $("#dtable").innerHTML = "<tr><th>Fecha</th><th>Precio</th><th>Ahorro</th><th>Stock</th></tr>" +
    s.slice(-12).reverse().map(([d,pr,st,sv]) =>
      `<tr><td>${d}</td><td>${fmt(pr)}</td><td>${sv?"$"+(+sv).toFixed(2):"—"}</td><td>${st?"✓":"✗"}</td></tr>`).join("");
  if (!dlg.open) dlg.showModal();
  if (s.length >= 2){
    $("#chart").style.display="block";
    chart = chart || echarts.init(document.getElementById("chart"), null, {renderer:"svg"});
    chart.setOption({
      grid:{left:55,right:15,top:20,bottom:30},
      xAxis:{type:"category",data:s.map(p=>p[0]),axisLabel:{color:"#8b93ad",fontSize:10}},
      yAxis:{type:"value",axisLabel:{color:"#8b93ad",formatter:v=>"$"+v},splitLine:{lineStyle:{color:"#2a3350"}},scale:true},
      series:[{type:"line",step:"end",data:s.map(p=>+(p[1]/100).toFixed(2)),showSymbol:true,symbolSize:5,
        lineStyle:{color:"#60a5fa"},areaStyle:{color:"#60a5fa18"},
        markLine:{silent:true,data:[{yAxis:+(Math.min(...s.map(p=>p[1]))/100).toFixed(2)}],
          lineStyle:{color:"#34d399",type:"dashed"},label:{formatter:"mín",color:"#34d399"}}}],
      tooltip:{trigger:"axis",valueFormatter:v=>"$"+v},
    }, true); chart.resize();
  } else {
    $("#chart").style.display="none";
  }
}
render();
// deep link compartible: ?sku=498227 abre la ficha directo
const qs = new URLSearchParams(location.search).get("sku");
if (qs && D.products[qs]) openProd(qs);
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js", {scope: "./"}).catch(()=>{});
}
</script>
